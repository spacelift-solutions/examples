[defaults]
remote_user=ec2-user
force_color=True
inventory = aws_ec2.yml

[inventory]
# Fail the run when an inventory source does not parse. Without this Ansible
# only prints a warning, matches no hosts, and exits 0. Spacelift then reports
# the run as finished with no changes, which hides the real error.
any_unparsed_is_failed = True
